port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
- name: 001|s5|HK|154.219.101.12:1080|cn-foreign|387ms
  type: socks5
  server: 154.219.101.12
  port: 1080
  udp: false
  skip-cert-verify: true
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - AUTO-Foreign
  - AUTO-CN
  - HTTPS-All
  - SOCKS5-All
  - DIRECT
- name: AUTO-Foreign
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  proxies:
  - 001|s5|HK|154.219.101.12:1080|cn-foreign|387ms
- name: AUTO-CN
  type: url-test
  url: http://www.baidu.com
  interval: 300
  tolerance: 100
  proxies:
  - 001|s5|HK|154.219.101.12:1080|cn-foreign|387ms
- name: HTTPS-All
  type: select
  proxies:
  - HTTPS-Fast
  - HTTPS-Medium
  - HTTPS-Slow
- name: HTTPS-Fast
  type: select
  proxies:
  - DIRECT
- name: HTTPS-Medium
  type: select
  proxies:
  - DIRECT
- name: HTTPS-Slow
  type: select
  proxies:
  - DIRECT
- name: SOCKS5-All
  type: select
  proxies:
  - SOCKS5-Fast
  - SOCKS5-Medium
  - SOCKS5-Slow
- name: SOCKS5-Fast
  type: select
  proxies:
  - 001|s5|HK|154.219.101.12:1080|cn-foreign|387ms
- name: SOCKS5-Medium
  type: select
  proxies:
  - DIRECT
- name: SOCKS5-Slow
  type: select
  proxies:
  - DIRECT
rules:
- DOMAIN-SUFFIX,google.com,AUTO-Foreign
- DOMAIN-SUFFIX,gstatic.com,AUTO-Foreign
- DOMAIN-SUFFIX,youtube.com,AUTO-Foreign
- DOMAIN-SUFFIX,github.com,AUTO-Foreign
- DOMAIN-SUFFIX,baidu.com,AUTO-CN
- DOMAIN-SUFFIX,taobao.com,AUTO-CN
- GEOIP,CN,AUTO-CN
- MATCH,PROXY
name: ProxyGate-hk
